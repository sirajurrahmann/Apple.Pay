<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cybersource</title>
    <script src="/js/env.js"></script>
    <script src="../js/common.js"></script>
    <script src="https://assets.opayo.cloud/assets/js/opayo-1.2.40.js"
        integrity="sha512-ZplJXUTeRh13LTLjfwydrUFpRJaHOoSIKdoMQP4s1gWyJoXqsTqxBeGdt4fQyfNq/Xo21u8IGaA3PjLfiefZJw=="
        crossorigin="anonymous"></script>
    <style>
        #hosted-payments-container iframe {
            border-radius: 8px;
            height: 450px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #submit-tokenization {
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 1rem;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        #hosted-token-frame {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
        }

        button {
            padding: .8rem;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            background: #f9f9f9;
            white-space: pre-wrap;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <h1>Cybersource Unified Checkout</h1>

    <div id="config-section"></div>

    <br />
    <div>
        <input type="hidden" id="cybersourceToken" name="@Model.FieldName" value="" />
        <style>
            iframe[name=htpIframe0] {
                border: none;
                width: 100%;
            }
        </style>
        <div class="row">
            <div class="col-sm-16 col-md-16" id="cybersource-card-details">
                <div id="errors-output" role="alert"></div>
                <div id="buttonPaymentListContainer"></div>
                <div id="embeddedPaymentContainer"></div>
            </div>

            <div class="text-center" hidden="hidden" id="cybersource-card-processed-section">
                Payment card entered successfully, please continue to complete checkout
            </div>


            <h3>Log Output</h3>
            <div id="log"></div>

            <script>
                // 1. Render Configuration Fields
                renderGenericFields('config-section', {
                    serverBase: 'http://localhost:14442/',
                    apiPrefix: '/cybersource/v1.0/payments',
                    methodId: '2b3cc486-458f-4df5-98fb-6c6cfb4092f1',
                    // methodId: 'a9f6f6e4-01a7-4fe1-bec7-cd2c6e705c88',
                    subscriptionId: '0000006e-0000-0000-0000-000000000000',
                    // scopeId: '4c3a230a-72ad-4bdf-a602-38ad9ce48b1d',
                    scopeId: '8a9bd9c0-fb0d-47fc-b346-a08a48c7806f',
                    // flowId: 'bc7bb42a-0c89-4cdb-a71f-0ca2ac9e88fa'
                    flowId: '63290511-2c91-40ab-9028-809e1f2b9962'
                });

                document.addEventListener("DOMContentLoaded", () => {
                    initTokenization();
                });

                function showThreeDSecureIframe(opayoTransactionId, threeDSecureV2) {
                    document.getElementById('hosted-payments-container').hidden = true;
                    document.getElementById('threeDSecureIframeDiv').hidden = false;

                    let form = document.getElementById('opayo-threeD-secure-iframe-form');
                    form.action = threeDSecureV2.acsUrl;

                    form[0].value = threeDSecureV2.cReq;
                    form[1].value = opayoTransactionId;
                    form[2].value = threeDSecureV2.acsTransId;

                    form.submit();
                }

                async function initTokenization() {
                    setLoading('submit-tokenization', true, 'Initializing SDK...');
                    const methodId = getMethodId();

                    // NOTE: Assuming Opayo has a similar hosted tokenization session endpoint
                    const res = await fetch(buildEndpoint(`/${methodId}/checkout`), {
                        method: 'POST',
                        headers: buildHeaders(false),
                        body: JSON.stringify({
                            hostUrl: window.location.origin,
                            value: {
                                "currency": "USD",
                                "amount": 0.50,
                            }
                        })
                    });

                    if (!res.ok) {
                        log("Error initializing tokenization session", await res.text());
                        setLoading('submit-tokenization', false);
                        return;
                    }
                    const { result, error } = await res.json();

                    loadJS(result.clientLibraryUrl, true, () => onScriptLoaded(result.token), result.clientLibraryIntegrity);
                }

                function onScriptLoaded(session) {
                    const showArgs = {
                        displayMode: "inline",
                        sidebar: false,
                        paymentOptions: {
                            card: {
                                enabled: true
                            }
                        },
                        containers: {
                            paymentSelection: "#buttonPaymentListContainer",
                            paymentScreen: "#embeddedPaymentContainer"
                        }
                    };

                    Accept(session)
                        .then(function (accept) {
                            console.log(accept)
                            // false indicates to render it in embedded component instead of sidebar 
                            return accept.unifiedPayments(false);
                        })
                        .then(function (up) {
                            return up.show(showArgs);
                        })
                        .then(async function (token) {
                            const res = await processFlowPaymentAsync(`http://localhost:14442/opayo/v1.0/payments/${methodId}/${getGenericField('flowId')}/${getGenericField('scopeId')}`,
                                methodId, (paymentData) => {
                                    paymentData.idempotencyKey = '1233';
                                    paymentData.value = {
                                        currency: 'GBP',
                                        amount: 10
                                    },
                                        paymentData.threeDSecure = {
                                            ...browserInfo
                                        };
                                    paymentData.card = {
                                        merchantSessionKey: merchantSessionKey.key,
                                        identifier: tokenisationResult.cardIdentifier
                                    };

                                    log('Payment Data', paymentData);
                                });


                            log('Payment Response', res);
                        }).catch(function (error) {
                            console.log(error);
                            throw error;
                        });
                }
            </script>
</body>

</html>

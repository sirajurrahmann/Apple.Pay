<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Opayo Tokenization</title>
    <script src="/js/env.js"></script>
    <script src="../js/common.js"></script>
    <script src="https://assets.opayo.cloud/assets/js/opayo-1.2.40.js"
        integrity="sha512-ZplJXUTeRh13LTLjfwydrUFpRJaHOoSIKdoMQP4s1gWyJoXqsTqxBeGdt4fQyfNq/Xo21u8IGaA3PjLfiefZJw=="
        crossorigin="anonymous"></script>
    <style>
        #hosted-payments-container iframe {
            border-radius: 8px;
            height: 450px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #submit-tokenization {
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 1rem;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        #hosted-token-frame {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
        }

        button {
            padding: .8rem;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            background: #f9f9f9;
            white-space: pre-wrap;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <h1>Opayo Tokenization Checkout</h1>

    <div id="config-section"></div>

    <br />
    <div>
        <div id="threeDSecureIframeDiv" hidden>
            <iframe name="threeDSecureIframe" width="500px" height="300px"></iframe>

            <form id="opayo-threeD-secure-iframe-form" method="post" target="threeDSecureIframe">
                <input type="hidden" name="creq" />
                <input type="hidden" name="threeDSSessionData" />
                <input type="hidden" name="acsTransID" />
            </form>
        </div>

        <form id="checkout-form" action="/checkout" method="post">
            <div id="hosted-payments-container">
            </div>
            <button id="submit-tokenization">Submit Payment</button>
        </form>
    </div>


    <h3>Log Output</h3>
    <div id="log"></div>

    <script>
        // /c82a457d-994e-496b-bf82-52b9fc1c61c5/63290511-2c91-40ab-9028-809e1f2b9963/2a6b8094-0d4a-4beb-b2e5-485b8a5880ed/process
        // 1. Render Configuration Fields
        renderGenericFields('config-section', {
            apiPrefix: getEnv('OPAYO_BASE_URL_ID') || 'http://localhost:14442/opayo/v1.0/',
            methodId: '6545d794-2a91-483c-8a5d-97e04bdc6011',
            // methodId: 'a9f6f6e4-01a7-4fe1-bec7-cd2c6e705c88',
            subscriptionId: '0000006e-0000-0000-0000-000000000000',
            flowId: '63290511-2c91-40ab-9028-809e1f2b9963',
            // scopeId: '8a9bd9c0-fb0d-47fc-b346-a08a48c7806f',
            // flowId: 'bc7bb42a-0c89-4cdb-a71f-0ca2ac9e88fa'
            // flowId: '63290511-2c91-40ab-9028-809e1f2b9962'
            scopeId: '2a6b8094-0d4a-4beb-b2e5-485b8a5880ed'
        });

        document.addEventListener("DOMContentLoaded", () => {
            initTokenization();
        });

        function showThreeDSecureIframe(opayoTransactionId, threeDSecureV2) {
            document.getElementById('hosted-payments-container').hidden = true;
            document.getElementById('threeDSecureIframeDiv').hidden = false;

            let form = document.getElementById('opayo-threeD-secure-iframe-form');
            form.action = threeDSecureV2.acsUrl;

            form[0].value = threeDSecureV2.cReq;
            form[1].value = opayoTransactionId;
            form[2].value = threeDSecureV2.acsTransId;

            form.submit();
        }

        async function initTokenization() {
            setLoading('submit-tokenization', true, 'Initializing SDK...');
            const methodId = getMethodId();

            const apiPrefix = document.getElementById("apiPrefix").value;
            const apiUrl = apiPrefix + `payments/${methodId}/merchantsessionkey`;
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: buildHeaders(false),
            });

            if (!res.ok) {
                log("Error initializing tokenization session", await res.text());
                setLoading('submit-tokenization', false);
                return;
            }

            const { result: { key } } = await res.json();
            log("Intialized with ", key);

            try {
                const setConfig = () => {
                    OpayoConfig.restHost = 'https://sandbox.opayo.eu.elavon.com'
                    OpayoConfig.restBaseURL = ' https://sandbox.opayo.eu.elavon.com/api/v1'
                }
                if (!OpayoConfig) {
                    setTimeout(() => { setConfig() }, 1000);
                } else {
                    setConfig();
                }


                const checkout = opayoCheckout({
                    merchantSessionKey: key,
                    containerSelector: '#hosted-payments-container',
                    styles: {
                        base: {
                            fontSize: '16px',
                            color: '#333',
                            fontFamily: 'Arial, sans-serif',
                        },
                        error: {
                            color: 'red'
                        },
                        focus: {
                            color: '#007bff'
                        }
                    },
                    onTokenise: async function (tokenisationResult) {
                        setLoading('submit-tokenization', true, 'Processing Payment...');
                        if (tokenisationResult.success) {
                            log('CardIdentifier', tokenisationResult.cardIdentifier);

                            //const res = await processFlowPaymentAsync(`https://beta.n3o.cloud/eu1/api/checkout/opayo/v1.0/payments/${methodId}/${getGenericField('flowId')}/${getGenericField('scopeId')}`,
                            const res = await processFlowPaymentAsync(`http://localhost:14442/opayo/v1.0/credentials/${methodId}/${getGenericField('flowId')}/${getGenericField('scopeId')}`,
                                // const res = await processFlowPaymentAsync(`http://localhost:25713/opayo/v1.0/${methodId}/flow/payment`,
                                methodId, (paymentData) => {
                                    paymentData.setupPayment = {
                                        activeCheckOnly: true,
                                        value: {
                                            currency: 'GBP',
                                            amount: 10
                                        }
                                    };

                                    paymentData.threeDSecure = {
                                        ...browserInfo
                                    };
                                    paymentData.card = {
                                        merchantSessionKey: key,
                                        identifier: tokenisationResult.cardIdentifier
                                    };

                                    // paymentData.parameters.baseUrl = 'http://127.0.0.1:25713/';

                                    log('Payment Data', paymentData);
                                });


                            log('Payment Response', res);

                            if (res.result && res.result.requireAction) {
                                showThreeDSecureIframe(res.result.opayoTransactionId, res.result.threeDSecureV2);
                                document.getElementById('submit-tokenization').style.display = 'none';
                            } else {
                                setLoading('submit-tokenization', false);
                            }
                        } else {
                            console.error(tokenisationResult.error.errorMessage);
                            log("Tokenization Error: " + tokenisationResult.error.errorMessage);
                            setLoading('submit-tokenization', false);
                        }
                    }
                });

                checkout.form({ formSelector: '#checkout-form' });
                setLoading('submit-tokenization', false);
            } catch (error) {
                console.error(error);
                log("Error initializing tokenizer", error);
                setLoading('submit-tokenization', false);
            }
        }
        // 2. Setup Persistence
        const sessionKey = 'opayo.config.v1';
        setupConfigPersistence(sessionKey);

        async function initOpayo() {
            log("Opayo Page Loaded. SDK available: " + (typeof opayoCheckout !== 'undefined'));
        }

        initOpayo();
    </script>
</body>

</html>

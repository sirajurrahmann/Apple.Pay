<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PayPal Checkout</title>
    <script src="/js/env.js"></script>
    <script src="../js/common.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display: block; margin: 8px 0 6px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
        button { padding: .8rem; width: 100%; background: #0070ba; color: #fff; border: none; border-radius: 6px; font-weight: bold; transition: opacity .3s, background-color .2s; cursor: pointer; }
        #log { border: 1px solid #ccc; padding: 10px; height: 250px; overflow-y: auto; background: #f9f9f9; white-space: pre-wrap; font-size: 13px; }
        #paypal-button-container { margin-top: 12px; }
    </style>
</head>
<body>
    <h1>PayPal Checkout</h1>

    <div id="config-section"></div>

    <script>

        renderGenericFields('config-section', {
            apiPrefix: getEnv('PAYPAL_BASE_URL_ID') || 'http://localhost:14442/paypal/v1.0/',
            methodId: getEnv('PAYPAL_METHOD_ID') || '6a645f78-e820-4e3e-9b68-be583edc5ee9',
            subscriptionId: getEnv('SUBSCRIPTION_ID', '0000006e-0000-0000-0000-000000000000'),
            scopeId: '8a9bd9c0-fb0d-47fc-b346-a08a48c7806f',
            flowId: '63290511-2c91-40ab-9028-809e1f2b9962'
        });
    </script>

    <div class="form-group">
        <label for="amount">Amount</label>
        <input id="amount" type="number" value="1.00" step="0.01" min="0.01" />
        <label for="currency">Currency</label>
        <select id="currency">
            <option value="GBP">GBP</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
        </select>
    </div>

    <div id="paypal-button-container"></div>

    <h3>Log Output</h3>
    <div id="log"></div>

    <script>
        function log(title, obj) {
            const el = document.getElementById('log');
            const line = obj ? `${title}: ${JSON.stringify(obj, null, 2)}` : title;
            el.textContent += (line + "\n");
            el.scrollTop = el.scrollHeight;
        }

        (function loadPayPalSdk() {
            const clientId = getEnv('PAYPAL_CLIENT_ID', 'AdXBENyQAnjXXmQo_qvyLiinrcFzpl3gzupBFRPjw0gu1CKdwLIrlkzyC3Gy71C6yiKubCo-SHq_Tdul');
            const defaultCurrency = getEnv('PAYPAL_CURRENCY', 'GBP');

            const currencySelect = document.getElementById('currency');
            currencySelect.value = defaultCurrency;

            if (!clientId) {
                log('Error', 'PAYPAL_CLIENT_ID not configured in .env');
                return;
            }

            let srcUri = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(clientId)}`;
            srcUri+= `&currency=${encodeURIComponent(defaultCurrency)}`;
            srcUri+= `&intent=authorize`;
            // srcUri+= `&components=card-fields`;

            const script = document.createElement('script');
            script.src = srcUri;
            script.onload = initButtons;
            script.onerror = () => log('Error', 'Failed to load PayPal SDK');
            document.head.appendChild(script);
        })();

        function initButtons() {
            const amountEl = document.getElementById('amount');
            const currencyEl = document.getElementById('currency');

            paypal.Buttons({
                style: { layout: 'vertical', shape: 'rect', color: 'gold', label: 'paypal' },
                createOrder: function (data, actions) {
                    const amount = (parseFloat(amountEl.value) || 1.00).toFixed(2);
                    const currency = currencyEl.value || getEnv('PAYPAL_CURRENCY', 'GBP');

                    log('CreateOrder', { amount, currency });

                    return actions.order.create({
                        purchase_units: [{
                            amount: {
                                currency_code: currency,
                                value: amount
                            }
                        }]
                    });
                },
                onApprove: async function (data, actions) {
                    log('OnApprove', data);
                    await actions.order.authorize().then(function (details) {
                        let authorization = details.purchase_units[0].payments?.authorizations?.[0];

                        log('CaptureResult', details);
                        const apiPrefix = document.getElementById("apiPrefix").value;
                        const methodId = document.getElementById("methodId").value;
                        const apiUrl = apiPrefix + "payments/" + `${methodId}/${getGenericField('flowId')}/${getGenericField('scopeId')}`;
                        const orderId = data.orderID;

                        processFlowPaymentAsync(apiUrl, methodId, (paymentData) => {
                            paymentData.idempotencyKey = orderId;
                            paymentData.value = {
                                currency: currencyEl.value || getEnv('PAYPAL_CURRENCY', 'GBP'),
                                amount: parseFloat(amountEl.value) || 1.00
                            };
                            paymentData.AuthorizationId = authorization.id;
                            paymentData.email = details.payer.email_address;
                            log('Payment Data', paymentData);
                        }).then(res => {
                            log('Payment Response', res);
                        }).catch(err => {
                            log('Payment Error', err);
                        });
                    });
                },
                onError: function (err) {
                    log('Error', err);
                    alert('Error: ' + (err && err.message || 'Unknown error'));
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>

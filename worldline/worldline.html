<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Worldline Tokenization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 1rem;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        #hosted-token-frame {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
        }

        button {
            padding: .8rem;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            transition: opacity 0.3s;
        }
    </style>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            background: #f9f9f9;
            white-space: pre-wrap;
            font-size: 13px;
        }

        #tokenContainer {
            display: none;
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 220px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
    <script
        src="https://payment.preprod.direct.worldline-solutions.com/hostedtokenization/js/client/tokenizer.min.js"></script>
    <!-- contains the methods needed for tokenization -->

</head>

<body>


    <h1>Worldline Tokenization Checkout</h1>

    <div id="config-section"></div>

    <br />
    <div id="hosted-token-frame-three-d-secure" hidden>
        <iframe id="secure3dIFrame" name="secure3dIFrame" style="width: 100%; height: 800px; border: none;"></iframe>
    </div>
    <div id="hosted-token-frame">
    </div>
    <button id="submit-tokenization">Submit Payment</button>
    <h3>Log Output</h3>
    <div id="log"></div>

    <script src="/js/env.js"></script>
    <script src="../js/common.js"></script>
    <script>
        // 1. Render Configuration Fields (with .env support)
        const sessionKey = 'worldline.config.v1';
        loadEnv().then(() => {
            renderGenericFields('config-section', {
                serverBase: 'http://localhost:25713',
                apiPrefix: '/worldline/v1.0',
                methodId: getEnv('WORLDLINE_METHOD_ID', '264cd00d-3d90-4eaa-9bd5-8cc0b7e5fbd6'),
                subscriptionId: getEnv('SUBSCRIPTION_ID', '00000006-0000-0000-0000-000000000000')
            });
            setupConfigPersistence(sessionKey);
        });

        // 3. Main Logic
        let tokenizer;
        
        async function initTokenization() {
            setLoading('submit-tokenization', true, 'Initializing...');
            document.getElementById('hosted-token-frame').innerHTML = '';
            const methodId = getMethodId();
            try {
                const res = await fetch(buildEndpoint(`${methodId}/hostedtokenizationsession`), {
                    method: 'POST',
                    headers: buildHeaders(false),
                    body: JSON.stringify({ 'account': account })
                });

                if (!res.ok) {
                    log("Error initializing session: " + res.statusText);
                    setLoading('submit-tokenization', false);
                    return;
                }

                const { hostedTokenizationId, hostedTokenizationUrl } = await res.json();
                log("Intialized with " + hostedTokenizationId);
                
                async function initializeTokenizer(hostedTokenizationUrl) {
                    try {
                        tokenizer = new Tokenizer(hostedTokenizationUrl, 'hosted-token-frame', { hideCardholderName: false });
                        await tokenizer.initialize();
                        setLoading('submit-tokenization', false);
                    } catch (error) {
                        console.error(error);
                        log("Error initializing tokenizer: " + error.message);
                        setLoading('submit-tokenization', false);
                    }
                }

                initializeTokenizer(hostedTokenizationUrl);
            } catch (err) {
                log("Error: " + err.message);
                setLoading('submit-tokenization', false);
            }

            // On submit, call built-in function
            const submitBtn = document.getElementById('submit-tokenization');
            // Remove old listeners by cloning
            const newBtn = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newBtn, submitBtn);
            
            newBtn.addEventListener('click', () => {
                if (!tokenizer) {
                    log("Tokenizer not initialized");
                    return;
                }
                
                setLoading('submit-tokenization', true, 'Processing Payment...');
                
                tokenizer.submitTokenization({ storePermanently: false })
                    .then(async result => {
                        console.log(result.hostedTokenizationId);
                        await processFlowCredentialRequest(result.hostedTokenizationId);
                    })
                    .catch(err => {
                        log("Tokenization failed: " + err.message);
                        setLoading('submit-tokenization', false);
                    });
            });
        }

        // Re-init when bearer token changes
        const bearerTokenEl = document.getElementById('bearerToken');
        if(bearerTokenEl) {
             bearerTokenEl.addEventListener('input', debounce(() => {
                 initTokenization();
            }, 1000));
        }

        // Initial load
        initTokenization();

        function processFlowCredentialRequest(token) {
            const methodId = getMethodId();
            
            // Construct flowParameters dynamically
            const flowParameters = {
                flowId: "",
                flowRevision: 1,
                scopeId: '',
                billingInfo: billingInfo,
                namedParameters: {
                    methodId: methodId
                }
            };

            const credentialData = {
                account: account,
                Parameters: flowParameters,
                Request: {
                    hostedTokenizationId: token,
                    setupPayment: {
                        value: {
                            currency: 'EUR',
                            amount: 10
                        },
                        activeCheckOnly: true
                    },
                    threeDSecure: {
                        ...browserInfo
                    },
                    redirectUrl: `${window.location.origin}/worldline/worldline3ds.html`,

                }
            };
            
            return fetch(buildEndpoint(`${methodId}/flow/credential`), {
                method: 'POST',
                headers: buildHeaders(true),
                body: JSON.stringify(credentialData),
            }).then(res => res.json())
                .then(apiRes => {
                    log("Payment: ", apiRes);
                    
                    if (apiRes.result && apiRes.result.requireAction && apiRes.result.actionUrl) {
                        document.getElementById('hosted-token-frame').hidden = true;
                        document.getElementById('hosted-token-frame-three-d-secure').hidden = false;
                        var iframe = document.getElementById("secure3dIFrame");
                        iframe.src = apiRes.result.actionUrl;
                        
                        document.getElementById('submit-tokenization').style.display = 'none';
                    } else {
                        setLoading('submit-tokenization', false);
                    }
                })
                .catch(err => {
                    log("Credential Request Failed: " + err.message);
                    setLoading('submit-tokenization', false);
                });
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="../js/common.js"></script>
    <title>Apple Pay Static Debug Page</title>
    <script crossorigin src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        #applePayBtn {
            display: none;
            padding: 12px 20px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        #log {
            border: 1px solid #ccc;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            background: #f9f9f9;
            white-space: pre-wrap;
            font-size: 13px;
        }

        #tokenContainer {
            display: none;
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 220px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h2>Apple Pay – Static Page (Debug Enabled)</h2>

    <div id="config-section"></div>
    <apple-pay-button id="applePayBtn" buttonstyle="black" type="plain" locale="en-US">
    </apple-pay-button>

    <h3>Log Output</h3>
    <div id="log"></div>
    <style>
        apple-pay-button {
            --apple-pay-button-width: 150px;
            --apple-pay-button-height: 30px;
            --apple-pay-button-border-radius: 3px;
            --apple-pay-button-padding: 0px 0px;
            --apple-pay-button-box-sizing: border-box;
        }
    </style>



    <div id="tokenContainer">
        <h3>Apple Pay Payment JSON</h3>
        <textarea id="paymentJson" readonly></textarea>
        <br />
        <button onclick="copyJson()">Copy JSON</button>
    </div>

    <script>
        const defaultFields = {
            serverBase: 'https://c104d306fbc5.ngrok-free.app',
            apiPrefix: 'https://c104d306fbc5.ngrok-free.app/cybersource/v1.0/',
            methodId: '2b3cc486-458f-4df5-98fb-6c6cfb4092f1',
            subscriptionId: '0000006e-0000-0000-0000-000000000000',
            scopeId: '8a9bd9c0-fb0d-47fc-b346-a08a48c7806f',
            flowId: '63290511-2c91-40ab-9028-809e1f2b9962',
            merchantId: 'merchant.cloud.n3o.testapp'
        };
        const otherFields = [{ id: 'merchantId', label: 'Merchant Id', type: 'text', placeholder: 'Merchant Id', value: defaultFields.merchantId },
        { id: 'hostUrl', label: 'host Url', type: 'text', placeholder: 'Host URl' }
        ];

        renderGenericFields('config-section', defaultFields, otherFields);

        document.addEventListener("DOMContentLoaded", () => {

            log("Page loaded");

            if (!window.ApplePaySession) {
                log("ApplePaySession not available");
                return;
            }

            if (!ApplePaySession.canMakePayments()) {
                log("Apple Pay cannot make payments on this device");
                return;
            }

            log("Apple Pay is available");
            document.getElementById("applePayBtn").style.display = "inline-block";
        });

        /* -----------------------------
           Start Apple Pay
        ------------------------------*/
        document.getElementById("applePayBtn").addEventListener("click", startApplePay);
        document.getElementById('hostUrl').onchange = (event) => {
            defaultFields.hostUrl = event.target.value;
        }

        function startApplePay() {
            log("Apple Pay button clicked");

            const paymentRequest = {
                supportedMethods: "https://apple.com/apple-pay",
                merchantId: defaultFields.merchantId,
                countryCode: "US",
                currencyCode: "USD",
                supportedNetworks: ["visa", "masterCard", "amex"],
                merchantCapabilities: ["supports3DS"],
                requiredBillingContactFields: ['postalAddress', 'name', 'email', 'phone'],
                total: {
                    label: "Static Debug Store",
                    amount: "0.10"
                }
            };

            log("Payment request created", paymentRequest);

            const session = new ApplePaySession(3, paymentRequest);


            session.onvalidatemerchant = async (event) => {
                log("Merchant validation started", {
                    validationURL: event.validationURL
                });

                const params = new URLSearchParams(window.location.search);
                const serverUrl = params.get("hostUrl") ?? defaultFields.hostUrl;

                var server = serverUrl ?? document.getElementById("serverBase").value;
                const apiPrefix = document.getElementById("apiPrefix").value;
                const methodId = document.getElementById("methodId").value;
                const flowId = document.getElementById("flowId").value;
                const scopeId = document.getElementById("scopeId").value;
                console.log(server);
                const apiUrl = serverUrl ?? apiPrefix + methodId + "/validateapplepaymerchant";

                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: buildHeaders(),
                    body: JSON.stringify({
                        url: event.validationURL,
                        initiativeContext: window.location.host,
                        initiative: "web"
                    })
                }
                );

                const merchantSession = await response.json();

                log("Merchant validation response received", merchantSession);

                session.completeMerchantValidation(merchantSession.result);
            };

            /* -----------------------------
               Payment Authorized
            ------------------------------*/
            session.onpaymentauthorized = async (event) => {
                log("Payment authorized event received");

                // FULL Apple Pay payment object
                log("Apple Pay payment object generated", event.payment);
                log("Apple Pay event object generated", event);
                const billingContact = event.payment.billingContact;

                if (billingContact) {
                    log('Billing Address: ', billingContact);
                } else {
                    log('No billing contact returned');
                }

                // Show JSON for copying
                const prettyJson = JSON.stringify(event.payment);

                const res = await processFlowPaymentAsync(` https://6abe3b9116d9.ngrok-free.app/cybersource/v1.0/payments/${methodId}/${getGenericField('flowId')}/${getGenericField('scopeId')}`,
                    methodId, (paymentData) => {
                        paymentData.idempotencyKey = '1233';
                        paymentData.value = {
                            currency: 'GBP',
                            amount: 10
                        };

                        paymentData.digitalWallet = {
                            apple: {
                                token: prettyJson,
                                billingInfo: billingContact
                            }

                        };

                        log('Payment Data', paymentData);
                    });


                log('Payment Response', res);

                if (res.ok) {
                    log("Payment successfully sent to backend");
                    session.completePayment(ApplePaySession.STATUS_SUCCESS);

                    const json = await response.json();
                    log("Merchant backend response received", json);
                } else {
                    log("Payment failed on backend");
                    session.completePayment(ApplePaySession.STATUS_FAILURE);
                }


            };

            session.oncancel = (e) => {
                log("Apple Pay session cancelled by user", e);
            };

            session.begin();
            log("Apple Pay session started");
        }
    </script>

</body>

</html>
